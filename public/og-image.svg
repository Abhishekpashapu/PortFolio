      <stop stop-color="#050508"/>
      <stop offset="1" stop-color="#0b0f1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="440" x2="760" y2="180" gradientUnits="userSpaceOnUse">
